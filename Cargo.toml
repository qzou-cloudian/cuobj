[package]
name        = "cuobj"
version     = "0.1.0"
edition     = "2021"
description = "Safe Rust bindings for the NVIDIA cuObj SDK (client, server)"
license     = "Apache-2.0"
repository  = "https://github.com/NVIDIA/cuobj-rs"
documentation = "https://docs.rs/cuobj"
keywords    = ["rdma", "cuda", "nvidia", "s3", "gpu"]
categories  = ["api-bindings", "network-programming"]

[features]
default = []
client      = ["dep:cuobj-sys", "cuobj-sys/client"]
server      = ["dep:cuobj-sys", "cuobj-sys/server"]

[dependencies]
cuobj-sys = { path = "./cuobj-sys", optional = true }
thiserror  = "1"

[dev-dependencies]
tempfile = "3"
