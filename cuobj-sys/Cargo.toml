[package]
name          = "cuobj-sys"
version       = "0.2.0"
edition       = "2021"
description   = "Raw FFI bindings and C++ shims for the NVIDIA cuObj SDK (libcuobjclient + libcuobjserver)"
license       = "Apache-2.0"
repository    = "https://github.com/NVIDIA/cuobj-rs"
documentation = "https://docs.rs/cuobj-sys"
keywords      = ["rdma", "cuda", "nvidia", "ffi", "sys"]
categories    = ["api-bindings", "external-ffi-bindings"]
# The `links` key prevents other crates from also linking these libraries.
links = "cuobj"

[features]
default = []
client = []
server = []

[build-dependencies]
cc = "1.0"
